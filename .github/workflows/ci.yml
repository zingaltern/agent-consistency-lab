name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]  # 声明的最低版本也要真的跑（uuid7 有回退路径）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"
      - name: Lint
        run: ruff check .
      - name: Tests
        # 含崩溃矩阵小样本与四系统对照的单元级断言；默认过滤掉 live 主题的用例
        run: pytest -q
      - name: Live-path negative tests (no key in CI)
        # `-m live` 在这里跑的是**反例**：没有 key 时 live 模式必须给出可读失败并非零退出。
        # 真正的在线调用在本仓库永不执行（设计文档 B §8）。
        run: pytest -q -m live

  facts:
    # 「文档里的每个数字都必须能由命令再生」这条纪律的执行者：
    # claim 清单在 reports/documented-facts.json，逐条重跑再生命令并比对 JSON 路径。
    # 这里跑 run=verify 的轻 claim 集（约 40 秒，其中阈值扫描 `context_sweep --repeats 2` 独占约 38 秒）；
    # crash_matrix --repeats 5 / 1536 次整量评测 / 变异测试属于 nightly 作业（nightly.yml）。
    # ⚠️ W7 的 9 条成本 claim 曾在 nightly 里对账，结果是"改了代码、产物与文档一起过期，
    # 而 push 上没人看得见"（独立验证 2026-09-19 · P1）——它们已全部升到 verify，
    # 宁可多花 38 秒，也不要一条没人跑的对账。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"
      - name: Documented facts gate
        run: python scripts/check_facts.py --run verify --json-out /tmp/facts-report.json
      - name: Upload facts report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documented-facts-report
          path: /tmp/facts-report.json

  experiments:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"
      - name: Crash matrix (W2–W4 consistency semantics)
        # 退出码非零 ⇔ 出现 prediction-violated（不变量/重复副作用与预期不符）
        run: |
          python -m experiments.crash_matrix --repeats 2 \
            --json-out /tmp/matrix.json --md-out /tmp/matrix.md
      - name: Context cost experiment (W4)
        run: python -m experiments.context_cost --json-out /tmp/cost.json --md-out /tmp/cost.md
      - name: Four-system evaluation with gates (W5/W6)
        # 门禁包含：红线不变量、审批覆盖率、取证充分性、实验假设自检、配对 CI 方向，
        # 以及 W11 新增的四条**关系**门禁——`workflow.correct==workflow.sufficient`（指标定义）、
        # `gated_routes.novel_red_line==0` + `single_shot.novel_red_line>0`（新破坏性动作的对称自检）、
        # `crn.evidence_routes_agree`（跨系统比较没被随机种子污染）。
        # 旧门禁只断言"某个比率等于多少常数"，改掉指标定义可以让它们全绿而结论失效。
        run: |
          python -m opsenv.suite --per-fault 8 --repeats 3 --gate \
            --json-out /tmp/eval.json --md-out /tmp/eval.md
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment-reports
          path: |
            /tmp/matrix.md
            /tmp/cost.md
            /tmp/eval.md
