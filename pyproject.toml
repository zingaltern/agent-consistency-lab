[project]
name = "agent-consistency-lab"
version = "0.8.0"
description = "面向崩溃一致性与治理语义的 Agent runtime 实验台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# 对照基线用的框架：只在跑 W5/W6 的评测时需要，核心 runtime 不依赖它
eval = [
    "langgraph>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# 项目文档与注释使用中文全角标点，这是刻意选择
ignore = ["RUF001", "RUF002", "RUF003"]
