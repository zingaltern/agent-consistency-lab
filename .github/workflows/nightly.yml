name: nightly

# 重作业（整量重跑、变异测试、随机注入）不进 verify 主作业：它们要么按分钟计，
# 要么需要更长的窗口。夜间与手动触发是它们的归属，失败仍然要让 CI 变红。
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  facts-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"
      - name: Documented facts (nightly class)
        # crash_matrix --repeats 5（70 次真实 SIGKILL）、1536 次整量评测、阈值扫描：
        # 这些是文档引用的整量数字，verify 里跑不起，但必须有人跑。
        run: python scripts/check_facts.py --run nightly --json-out /tmp/facts-nightly.json
      - name: Upload facts report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documented-facts-nightly
          path: /tmp/facts-nightly.json

  mutation:
    # 变异测试常设化（R-A5）：幸存的变异 = 测试盲区。与 tests/test_audit_regressions.py
    # （防已知 P0 复活）互补——审计回归防已知，变异测试探盲区。
    # 语义：**新增**幸存变异 ⇒ 退出 1（盲区扩大）；基线见 reports/mutation_baseline.json。
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"
      - name: Mutation gate (survivor regression)
        # 超时预算写在命令行参数里（--timeout 1320 = 22 分钟）：超时不是"跳过"而是"失败"——
        # 跑不完就无法判定有没有新增盲区。本地实测（8 并行）约 3~5 分钟，CI 用 4 并行并留余量。
        # 注意：**变异体总数为 0 也会判失败**（跑不起来 ≠ 没有盲区，评审 P0-1）。
        run: python scripts/mutation_check.py --timeout 1320 --max-children 4 --json-out /tmp/mutation.json
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: /tmp/mutation.json

  chaos-fuzz:
    # 随机时刻 SIGKILL fuzz（R-A2）+ 故障谱系探测器（R-A3）。
    # 判定全部由外部账本 oracle 作出（opsenv/oracle.py；读库连 -wal 一起快照）。
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"
      - name: Random-time SIGKILL fuzz (3 protection combos x 2 phases x 30 trials)
        # 退出码非零 ⇔ 出现新类违例 / oracle 的敏感性自检没通过 / 有"退出码非零但没有
        # time_hit marker"的试次（后者说明那次注入其实没发生）。敏感性自检**不可跳过**。
        # 注入窗口是**本机当次标定**出来的：换 runner 会重新标定，不需要人工同步参数。
        run: |
          python -m experiments.chaos_fuzz --repeats 30 --seed 20260917 \
            --workroot /tmp/fuzz --json-out /tmp/chaos_fuzz.json --md-out /tmp/chaos_fuzz.md
      - name: Fault-spectrum probes (SIGTERM / torn write + SIGSTOP / extra ledger row)
        run: |
          python scripts/probe_sigterm.py --json-out /tmp/probe_sigterm.json
          python scripts/probe_tornwrite.py --mode both --json-out /tmp/probe_tornwrite.json
          python scripts/probe_extra_ledger_row.py --json-out /tmp/probe_extra_ledger.json
      - name: Upload chaos reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-fuzz-reports
          path: |
            /tmp/chaos_fuzz.md
            /tmp/chaos_fuzz.json
            /tmp/probe_sigterm.json
            /tmp/probe_tornwrite.json
            /tmp/probe_extra_ledger.json
