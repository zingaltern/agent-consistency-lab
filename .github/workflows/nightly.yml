name: nightly

# 重作业（整量重跑、变异测试、随机注入）不进 verify 主作业：它们要么按分钟计，
# 要么需要更长的窗口。夜间与手动触发是它们的归属，失败仍然要让 CI 变红。
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  facts-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"
      - name: Documented facts (nightly class)
        # crash_matrix --repeats 5（70 次真实 SIGKILL）、1536 次整量评测、阈值扫描：
        # 这些是文档引用的整量数字，verify 里跑不起，但必须有人跑。
        run: python scripts/check_facts.py --run nightly --json-out /tmp/facts-nightly.json
      - name: Upload facts report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documented-facts-nightly
          path: /tmp/facts-nightly.json

  mutation:
    # 变异测试常设化（R-A5）：幸存的变异 = 测试盲区。与 tests/test_audit_regressions.py
    # （防已知 P0 复活）互补——审计回归防已知，变异测试探盲区。
    # 语义：**新增**幸存变异 ⇒ 退出 1（盲区扩大）；基线见 reports/mutation_baseline.json。
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"
      - name: Mutation gate (survivor regression)
        # 15 分钟预算写死在脚本参数里：超时不是"跳过"而是"失败"——跑不完就无法判定
        # 有没有新增盲区。本地实测（8 并行）约 4.7 分钟，CI 用 4 并行并留足余量。
        run: python scripts/mutation_check.py --timeout 1320 --max-children 4 --json-out /tmp/mutation.json
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: /tmp/mutation.json
